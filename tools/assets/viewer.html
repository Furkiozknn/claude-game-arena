<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GLB preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9dcc4; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #info { position: fixed; left: 8px; top: 6px; color: #2b2118; background: #fff8; padding: 4px 8px; border-radius: 6px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info">loading…</div>
<script type="module">
// Usage: viewer.html?src=path/to/model.glb[&lambert=1]
// Renders the model from four sides in one frame and prints its size and triangle count.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const info = document.getElementById('info');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff0d8, 0x6b7a4f, 1.6));
const sun = new THREE.DirectionalLight(0xffdfb0, 2.6);
sun.position.set(-3, 5, 3);
scene.add(sun);

new GLTFLoader().load(q.get('src'), gltf => {
  const root = gltf.scene;
  let tris = 0, meshes = 0;
  root.traverse(o => {
    if (!o.isMesh) return;
    meshes++;
    tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
    if (q.get('lambert')) o.material = new THREE.MeshLambertMaterial({ map: o.material.map, color: o.material.color, flatShading: true });
  });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  scene.add(root);
  const r = size.length() * 0.62;
  const views = [[0, 0.35], [Math.PI / 2, 0.35], [Math.PI, 0.35], [Math.PI / 4, 1.1]];
  const w = innerWidth / 2, h = innerHeight / 2;
  const cam = new THREE.PerspectiveCamera(40, w / h, r / 50, r * 20);
  views.forEach(([yaw, pitch], i) => {
    cam.position.set(center.x + Math.sin(yaw) * Math.cos(pitch) * r * 2.1, center.y + Math.sin(pitch) * r * 2.1, center.z + Math.cos(yaw) * Math.cos(pitch) * r * 2.1);
    cam.lookAt(center);
    const x = (i % 2) * w, y = (1 - Math.floor(i / 2)) * h;
    renderer.setViewport(x, y, w, h);
    renderer.setScissor(x, y, w, h);
    renderer.render(scene, cam);
  });
  info.textContent = `${q.get('src')} | size ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} | min y ${box.min.y.toFixed(2)} | ${meshes} meshes | ${Math.round(tris)} tris`;
  document.title = 'ready';
}, undefined, e => { info.textContent = 'error: ' + e.message; document.title = 'ready'; });
</script>
</body>
</html>
